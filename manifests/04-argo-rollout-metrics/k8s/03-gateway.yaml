apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: myapp-rollout-metrics-gateway
  namespace: 04-argo-rollout-metrics
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "myapp.rollout.split.metrics.local"